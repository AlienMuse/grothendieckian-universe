name: Permission request
description: Request permission for a use the licence does not cover (public request).
title: "[Permission] "
labels: ["permission"]
body:
  - type: markdown
    attributes:
      value: "Requests that should not be public can be sent by e-mail instead (see NOTICE.md)."
  - type: dropdown
    id: kind
    attributes:
      label: Kind of use
      options:
        - Teaching, beyond playing in class
        - Commercial promotion or a commercial event
        - A paid course or training
        - Use of the game's art or sound in a product
        - An adaptation or a port
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Description
      description: Who you are, what you would like to do, the scope, and how the game will be credited.
    validations:
      required: true
